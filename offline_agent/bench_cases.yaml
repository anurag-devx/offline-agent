# Test Bench: one test per built-in agent. {sandbox} = a fresh folder for each test.
# Checks run in code after the agent finishes. Your own agents can add a `bench:` section
# (task + checks) to their YAML; agents without one get a simple "does it answer?" test.
cases:
  - agent: General Assistant
    task: In one sentence, what is the capital of France?
    checks: [{answer_contains: Paris}]

  - agent: Math Helper
    task: What is 18% of 1240?
    checks: [{answer_contains: "223.2"}]

  - agent: File Helper
    setup: {notes.txt: "Team update: the product launch moves to Friday the 14th."}
    task: Read notes.txt in {sandbox} and tell me in one line when the launch is.
    checks: [{answer_contains: Friday}]

  - agent: Note Taker
    task: Please note that the team meeting is at 5pm on Monday.
    checks: [{file_contains: {path: notes.md, text: 5pm}}]

  - agent: File Sorter
    setup: {a.pdf: x, b.pdf: x, photo.jpg: x, sub/deep.pdf: x}
    task: Move all pdf files in {sandbox} to a new folder called all_pdf.
    checks:
      - {no_files: {folder: ".", extensions: [".pdf"]}}
      - {count_files: {folder: all_pdf, extensions: [".pdf"], equals: 2}}
      - {file_exists: sub/deep.pdf}
      - {file_exists: photo.jpg}

  - agent: Website Builder
    task: |
      Build a complete, fully interactive one-page website for a neighbourhood bakery called
      "Crumbs" in the folder site/ inside {sandbox}. It must work by opening index.html in a
      browser, with no server, no external libraries, fonts or CDNs.

      FILES
      - site/index.html, site/style.css (linked), site/script.js (loaded at the end of <body>).
      - Images you draw yourself as SVG files in site/images/: logo.svg, hero.svg, and one
        illustration per category: bread.svg, pastry.svg, cake.svg. Each is a real drawing made of
        shapes (not just text). Use them in the page with <img src="images/..." alt="...">.

      CONTENT (each section a <section> with this id)
      1. <header>: logo, the name "Crumbs", the tagline "Baked fresh every morning", a nav with
         links to #menu, #about, #hours, #order, a menu button id="menu-toggle" that opens/closes
         the nav on phones, and a dark-mode button id="theme-toggle".
      2. Hero: hero.svg and a "Order now" button that scrolls to #order.
      3. id="menu": at least 6 items (written in the HTML or built by script.js from a list) in a grid of cards, each with a picture (the category SVG),
         name, one-line description, price in rupees (e.g. ₹120), a category data-category="bread",
         "pastry" or "cake", and an "Add to cart" button. Include sourdough bread, croissants and a
         chocolate cake. Filter buttons above the grid: All, Breads, Pastries, Cakes.
      4. id="about": 3-4 sentences about the bakery's story.
      5. id="hours": a table. Mon-Sat 7am-8pm, Sunday 8am-2pm. A badge id="open-status" that shows
         "Open now" or "Closed" from the current day and time.
      6. id="order": a cart id="cart" listing added items with quantity, + and - buttons, a remove
         button, line totals and a grand total in ₹; "Your cart is empty" when empty. Below it an
         order form id="order-form" with name, phone and pickup time.
      7. id="contact": "12 Baker Street, Bengaluru", +91 98765 43210, mailto:hello@crumbs.in.
      8. <footer>: "© 2026 Crumbs".

      BEHAVIOUR (script.js)
      - Filter buttons show only the chosen category; All shows everything.
      - Add to cart / + / - / remove update the cart and total instantly. The cart is saved in
        localStorage and restored on reload.
      - The form validates before sending: name required, phone must be 10 digits, cart must not be
        empty. Show a clear error next to the wrong field. On success (use preventDefault, no real
        sending) show a confirmation id="order-confirmation" with the order summary and total, then
        empty the cart.
      - The open/closed badge updates from the real clock.
      - Dark mode switches colours via a class on <body> and is remembered in localStorage.
      - The menu button toggles the nav on small screens.

      DESIGN
      Warm colours with CSS variables (cream, brown, one accent) and a dark theme, readable font
      sizes, cards with rounded corners, hover effects on buttons, smooth scrolling, a viewport meta
      tag and a media query so it works on a phone.

      QUALITY
      Write every file completely. No placeholder text ("lorem ipsum", "TODO", "your text here").
      Read your files back, check them against this brief, fix gaps, then list the files.
    verify:
      enabled: true
      max_attempts: 3
      criteria: |
        Read site/index.html, site/style.css and site/script.js and list site/images. Complete only
        if every file in the brief exists; the 5 SVGs are real drawings and are used by the page;
        all sections and ids from the brief exist; at least 6 menu items with ₹ prices, categories
        and Add to cart buttons; script.js really implements filtering, the cart (+, -, remove,
        total, localStorage), form validation with errors and the confirmation, the open/closed
        badge, dark mode and the mobile menu toggle; and there is no placeholder text.
    checks:
      - {file_exists: site/index.html}
      - {file_exists: site/style.css}
      - {file_exists: site/script.js}
      - {count_files: {folder: site/images, extensions: [.svg], at_least: 5}}
      - {file_contains: {path: site/images/hero.svg, text: ['<svg']}}
      - {file_contains: {path: site/images/logo.svg, text: ['<svg']}}
      - {file_contains: {path: site/index.html, text: [Crumbs, Baked fresh every morning, style.css, script.js, name="viewport"]}}
      - {file_contains: {path: [site/index.html, site/script.js], text: [images/logo.svg, images/hero.svg, images/bread.svg, images/pastry.svg, images/cake.svg]}}
      - {file_contains: {path: site/index.html, text: ['id="menu"', 'id="about"', 'id="hours"', 'id="order"', 'id="contact"', '<header', '<footer', '<table']}}
      - {file_contains: {path: site/index.html, text: ['id="menu-toggle"', 'id="theme-toggle"', 'id="open-status"', 'id="cart"', 'id="order-form"']}}
      - {file_contains: {path: [site/index.html, site/script.js], text: [data-category, bread, pastry, cake, Add to cart, ₹]}}
      - {file_contains: {path: [site/index.html, site/script.js], text: [sourdough, croissant, chocolate cake]}}
      - {file_contains: {path: [site/index.html, site/script.js], text: [12 Baker Street, 98765 43210, mailto:hello@crumbs.in, © 2026 Crumbs]}}
      - {file_contains: {path: site/script.js, text: [addEventListener, localStorage, preventDefault, order-confirmation, getDay]}}
      - {file_contains: {path: site/style.css, text: ['@media', '--', 'hover']}}
      - {file_not_contains: {path: site/index.html, text: [lorem ipsum, TODO, your text here]}}
      - {file_not_contains: {path: site/script.js, text: [TODO]}}

  - agent: News Collector
    needs: internet
    task: Collect today's stock market headlines and save them to a text file in the news/ folder inside {sandbox}.
    checks: [{file_glob: {pattern: "news/*.txt", min_lines: 3}}]

  - agent: Web Researcher
    needs: internet
    task: Research what Ollama is and save a short report as reports/ollama.md inside {sandbox}.
    checks: [{file_glob: {pattern: "reports/*.md", min_lines: 3}}]

  - agent: Gmail Sorter
    needs: email
    dry: true   # the move is always denied: only the rule is checked, your mailbox is never changed
    task: Move emails from amazon to a folder called Receipts.
    checks: [{rule_written: amazon}]
