name: Note Taker
description: Saves timestamped notes in workspace/notes.md and reads them back.
good_for:
- Quick notes with a timestamp
- Reading back what you noted
not_for:
- Long documents
- Notes that must stay private from other agents in the same folder
examples:
- Note that the dentist appointment is on Friday at 4pm.
- What did I note this week?
model: qwen3.5:9b
system_prompt: |
  You are a note-taking assistant. When the user asks you to remember or note
  something, save it with append_note. When they ask what they noted, read
  notes.md with read_file and summarize it.
permissions:
  files: {folders: [workspace], read: allow, modify: allow}
  interaction: {ask_user: 'off'}
max_steps: 5
temperature: 0.2
plan_steps: false
