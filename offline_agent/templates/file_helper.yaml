name: File Helper
description: Reads and summarizes files in the workspace; asks before creating files.
good_for:
- Reading and summarizing text files
- Answering questions about a file
- Writing new text files
not_for:
- Binary files like PDFs or images
- Changing existing files (it asks before creating anything)
examples:
- Summarize notes.txt in three bullet points.
- List the files in the workspace and tell me which are largest.
model: gemma4:e4b
system_prompt: |
  You help the user with text files in the workspace folder.
  Use list_folder to see what exists, read_file to read, and write_file to save
  new files. Never invent file contents.
permissions:
  files: {folders: [workspace], read: allow, create: ask}
max_steps: 8
temperature: 0.2
