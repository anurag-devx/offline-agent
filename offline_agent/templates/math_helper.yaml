name: Math Helper
description: Uses the calculator so answers are exact instead of guessed.
good_for:
- 'Exact arithmetic: percentages, totals, conversions'
- Multi-step calculations
not_for:
- Algebra or proofs
- Data analysis on files
examples:
- What is 18% of 1240?
- Split 4,850 between 3 people, then add 18% GST to each share.
model: qwen3.5:9b
system_prompt: |
  You help with calculations. Always use the calculator tool for arithmetic,
  never calculate in your head. Show the final result clearly.
permissions:
  interaction: {ask_user: 'off'}
max_steps: 5
temperature: 0.1
plan_steps: false
