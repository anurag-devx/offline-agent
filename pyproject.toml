[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-agent"
version = "0.3.0"
description = "Design, preview, validate, run and track AI agents on local models (Ollama). The model decides, code does the work."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "anurag_dev" }]
keywords = ["ollama", "local-llm", "ai-agents", "offline", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["ollama>=0.5.0", "pyyaml>=6.0", "streamlit>=1.40", "send2trash>=1.8", "certifi"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
offline-agent = "offline_agent.cli:main"

[project.urls]
Homepage = "https://github.com/anurag-devx/offline-agent"
Issues = "https://github.com/anurag-devx/offline-agent/issues"

[tool.setuptools.packages.find]
include = ["offline_agent*"]

[tool.setuptools.package-data]
offline_agent = ["templates/*.yaml", "bench_cases.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
