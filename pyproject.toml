[project]
name = "offline-agent"
version = "0.1.0"
description = "Design, preview, validate, run and track AI agents on local models (Ollama). The model decides, code does the work."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "anurag_dev" }]
dependencies = ["ollama>=0.5.0", "pyyaml>=6.0", "streamlit>=1.40", "send2trash>=1.8", "certifi"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/crazzzyann/offline-agent"
Issues = "https://github.com/crazzzyann/offline-agent/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
